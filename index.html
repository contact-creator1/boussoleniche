<title>Boussole Niche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Mise en page : une colonne étroite. Quiz en 8 questions, écran d'analyse, aperçu gratuit avec contenu verrouillé, puis espace Coach en onglets. */
:root {
  --bg: #EDF0F7;
  --surface: #FFFFFF;
  --ink: #12162B;
  --muted: #586080;
  --line: #D3D8E8;
  --accent: #2B44F5;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E7FE;
  --tint-a: #E4E9FF;
  --tint-b: #FFEFE0;
  --tint-c: #DFF4EC;
  --tint-d: #F0E6FB;
  --bg2: #E9E6FA;
  --bg3: #E1F0F0;
  --good: #16794C;
  --warn: #A8620B;
  --bad: #B83A34;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1122;
    --surface: #171B30;
    --ink: #E9ECF8;
    --muted: #9AA2C2;
    --line: #2A3052;
    --accent: #8796FF;
    --accent-ink: #0E1122;
    --accent-soft: #232A55;
    --tint-a: #1B2250;
    --tint-b: #2E2218;
    --tint-c: #14302A;
    --tint-d: #2A1E48;
    --bg2: #16122B;
    --bg3: #0F1F24;
    --good: #4CC38A;
    --warn: #E3AE55;
    --bad: #FF8F86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1122;
  --surface: #171B30;
  --ink: #E9ECF8;
  --muted: #9AA2C2;
  --line: #2A3052;
  --accent: #8796FF;
  --accent-ink: #0E1122;
  --accent-soft: #232A55;
  --tint-a: #1B2250;
  --tint-b: #2E2218;
  --tint-c: #14302A;
  --tint-d: #2A1E48;
  --bg2: #16122B;
  --bg3: #0F1F24;
  --good: #4CC38A;
  --warn: #E3AE55;
  --bad: #FF8F86;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--line) 1px, transparent 1px), linear-gradient(180deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 75%, var(--bg) 100%);
  background-size: 22px 22px, 100% 100%;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 36rem; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.wrap > * { min-width: 0; }

header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2rem;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.lede { margin: 0; color: var(--muted); max-width: 60ch; }

.progress { display: flex; gap: 5px; }
.seg { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.seg.on { background: var(--accent); }

main { display: flex; flex-direction: column; gap: 16px; outline: none; }
h2.q {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.55rem;
  line-height: 1.15;
  letter-spacing: -0.01em;
  margin: 0;
  text-wrap: balance;
  outline: none;
}
h3 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.2rem;
  line-height: 1.2;
  margin: 0;
  text-wrap: balance;
}
.hint { margin: 0; color: var(--muted); max-width: 62ch; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opts.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt {
  appearance: none;
  width: 100%;
  min-height: 64px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  font: inherit;
  font-weight: 500;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
}
.opts.grid .opt { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 10px; min-height: 100px; padding: 12px; }
.opt:hover { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt:focus-visible, .btn:focus-visible, .linkbtn:focus-visible, .tab:focus-visible, .field:focus-visible, .chk input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt-text { display: flex; flex-direction: column; min-width: 0; }
.opt-text small { font-weight: 400; font-size: 14px; color: var(--muted); }

.tile {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: #FFFFFF;
  box-shadow: 0 6px 14px -6px rgba(20, 24, 60, 0.45);
}
.tile svg { width: 24px; height: 24px; }
.tile.lg { width: 56px; height: 56px; border-radius: 15px; }
.tile.lg svg { width: 30px; height: 30px; }
.t-cyan { background: linear-gradient(135deg, #19C6C0, #2B7BF5); }
.t-pink { background: linear-gradient(135deg, #FF6B8A, #E03C8A); }
.t-orange { background: linear-gradient(135deg, #FFB54A, #F4743B); }
.t-violet { background: linear-gradient(135deg, #C44BE8, #7F3CF0); }
.t-green { background: linear-gradient(135deg, #2FCB8B, #12987A); }
.t-blue { background: linear-gradient(135deg, #4D7CFF, #2B44F5); }

.btn {
  appearance: none;
  font: inherit;
  font-weight: 600;
  min-height: 48px;
  padding: 10px 18px;
  border-radius: 10px;
  border: 1.5px solid var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
  cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.linkbtn {
  appearance: none;
  align-self: flex-start;
  font: inherit;
  font-weight: 500;
  color: var(--muted);
  background: none;
  border: 0;
  padding: 8px 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
a { color: var(--accent); text-underline-offset: 3px; }

/* Analyse */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.steps li { display: flex; align-items: center; gap: 12px; color: var(--muted); }
.steps .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.steps li.done { color: var(--ink); }
.steps li.done .dot { background: var(--good); border-color: var(--good); }
.steps li.done .dot::after { content: ""; width: 6px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.steps li.now .dot { border-color: var(--accent); border-top-color: transparent; }
@media (prefers-reduced-motion: no-preference) {
  .steps li.now .dot { animation: spin 700ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
}

/* Fiche */
.niche-name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2.4rem;
  line-height: 1;
  letter-spacing: -0.025em;
  margin: 0;
  text-wrap: balance;
  outline: none;
}
.sec { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.sec p { margin: 0; max-width: 62ch; }
.sec ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; max-width: 62ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; font-size: 14px; }
.chip.mono { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); }
.gauges { display: flex; flex-direction: column; gap: 10px; }
.gauge { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.g-label { color: var(--muted); }
.g-val { display: flex; align-items: center; gap: 10px; }
.g-val b { min-width: 5.2em; text-align: right; font-weight: 600; }
.segs { display: flex; gap: 4px; }
.segs i { display: block; width: 26px; height: 8px; border-radius: 2px; background: var(--line); }
.segs i.good { background: var(--good); }
.segs i.warn { background: var(--warn); }
.segs i.bad { background: var(--bad); }
b.good { color: var(--good); }
b.warn { color: var(--warn); }
b.bad { color: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card p { margin: 0; max-width: 62ch; }
p.small, span.small { font-size: 14px; color: var(--muted); }
.stat-row { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); max-width: 14rem; }

/* Verrouillé */
.locked { display: flex; flex-direction: column; gap: 10px; }
.locked-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; }
.locked-row svg { flex: none; width: 20px; height: 20px; color: var(--muted); }
.bars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.bars i { display: block; height: 9px; border-radius: 5px; background: var(--line); }
.bars i:nth-child(1) { width: 88%; }
.bars i:nth-child(2) { width: 56%; }
.locked-row .tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); flex: none; }
.incl { list-style: none; padding: 0 !important; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.incl li { display: flex; gap: 10px; align-items: flex-start; }
.incl li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 8px; border-radius: 2px; background: var(--accent); }

.paywall { border: 1.5px solid var(--accent); border-radius: 14px; background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.price b { font-family: var(--font-display); font-size: 2.1rem; line-height: 1; }
.price span { color: var(--muted); font-size: 14px; }
.demo { align-self: flex-start; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }

/* Coach */
.coach-head { display: flex; align-items: center; gap: 14px; }
.coach-head > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
.tab { flex: none; appearance: none; font: inherit; font-weight: 600; font-size: 14px; min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.panel { display: flex; flex-direction: column; gap: 16px; }
.plan { display: grid; grid-template-columns: 3.4rem 1fr; gap: 12px 12px; margin: 0; }
.plan dt { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--accent); padding-top: 3px; }
.plan dd { margin: 0; max-width: 58ch; }
.plan dd.rest { color: var(--muted); }
.plan dd.review { font-weight: 600; }
.idea { display: flex; flex-direction: column; gap: 8px; }
.idea h4 { margin: 0; font-family: var(--font-display); font-size: 1.08rem; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.idea .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.idea .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.chk { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.chk input { flex: none; width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }
.chk span { min-width: 0; }
.track { display: grid; grid-template-columns: 2.4rem repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center; }
.track .hd { font-size: 12px; color: var(--muted); }
.field { width: 100%; min-width: 0; min-height: 40px; font: inherit; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.sources { font-size: 14px; color: var(--muted); }
.sources ul { margin: 6px 0 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }
textarea.copybox { width: 100%; min-height: 6rem; font: 13px/1.45 var(--font-mono); color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* Mise en avant : héro, scores, chiffres clés, aperçu flouté, offre */
.hero { position: relative; overflow: hidden; border-radius: 18px; padding: 20px; color: #FFFFFF; background: linear-gradient(135deg, #2B44F5 0%, #7F3CF0 62%, #E03C8A 130%); display: flex; flex-direction: column; gap: 12px; }
.hero::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px); background-size: 14px 14px; pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero .eyebrow { color: rgba(255, 255, 255, 0.82); }
.hero .niche-name { color: #FFFFFF; font-size: 2.6rem; }
.hero .tile { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35); }
.hero .demo { background: rgba(255, 255, 255, 0.2); color: #FFFFFF; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { background: rgba(255, 255, 255, 0.2); border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 500; }
.scores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.score { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.score .lbl { font-size: 12px; color: var(--muted); line-height: 1.2; }
.score b { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.1; }
.segs.wide { width: 100%; }
.segs.wide i { flex: 1; width: auto; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi b { font-family: var(--font-display); font-weight: 800; font-size: 2.5rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 14px; color: var(--muted); }
.teasers { display: flex; flex-direction: column; gap: 10px; }
.teaser { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 14px; min-height: 72px; display: flex; align-items: center; }
.teaser .blur { filter: blur(5px); user-select: none; flex: 1; min-width: 0; padding-right: 7rem; }
.teaser .blur b { display: block; font-family: var(--font-display); }
.teaser .blur span { font-size: 14px; color: var(--muted); }
.lockbadge { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.lockbadge svg { width: 16px; height: 16px; }
.paywall { border: 0; color: #FFFFFF; background: linear-gradient(160deg, #1B2160 0%, #4A2BB8 100%); box-shadow: 0 18px 40px -18px rgba(43, 68, 245, 0.7); }
.paywall h3 { color: #FFFFFF; font-size: 1.6rem; }
.paywall .price b { color: #FFFFFF; font-size: 2.8rem; }
.paywall .price span, .paywall .small { color: rgba(255, 255, 255, 0.78); }
.paywall .demo { background: rgba(255, 255, 255, 0.16); color: #FFFFFF; }
.paywall .incl li::before { content: "✓"; background: none; width: auto; height: auto; margin-top: 0; color: #5EE3A8; font-weight: 700; }
.btn.cta { background: #FFFFFF; color: #1B2160; border-color: #FFFFFF; min-height: 56px; font-size: 17px; width: 100%; }
.btn.cta:focus-visible { outline-color: #FFFFFF; }
.cta-bar { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: 0 12px 32px -10px rgba(10, 14, 40, 0.5); }
.cta-bar div { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.cta-bar b { font-family: var(--font-display); }
.cta-bar span { font-size: 13px; color: var(--muted); }
.hours { display: flex; flex-wrap: wrap; gap: 8px; }
.hours span { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; padding: 8px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { appearance: none; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; min-height: 56px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
.day b { font-family: var(--font-display); font-size: 15px; }
.day small { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.day.post { background: linear-gradient(135deg, #4D7CFF, #2B44F5); border-color: transparent; color: #FFFFFF; }
.day.post small { color: rgba(255, 255, 255, 0.85); }
.day.sel { outline: 3px solid var(--accent); outline-offset: 2px; }
.day:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.day-detail h4 { margin: 0; font-family: var(--font-display); font-size: 1.1rem; line-height: 1.25; text-wrap: balance; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; background: var(--surface); border: 1.5px solid var(--line); }
.legend i.p { background: linear-gradient(135deg, #4D7CFF, #2B44F5); border-color: transparent; }

/* Missions guidées et chat */
.daybar { display: flex; flex-direction: column; gap: 10px; }
.daybig { font-family: var(--font-display); font-weight: 800; font-size: 2.3rem; line-height: 1; letter-spacing: -0.02em; margin: 0; }
.dots { display: flex; gap: 5px; }
.dots i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.dots i.done { background: var(--good); }
.dots i.now { background: var(--accent); }
.step { gap: 10px; }
.step.done { background: var(--accent-soft); }
.step-head { display: flex; align-items: center; gap: 10px; }
.step-head h4 { margin: 0; font-family: var(--font-display); font-size: 1.1rem; line-height: 1.2; }
.stepnum { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.step.done .stepnum { background: var(--good); color: #FFFFFF; }
.stepbig { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; line-height: 1.25; text-wrap: balance; margin: 0; }
.step-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.stepcheck { display: flex; align-items: center; gap: 8px; min-height: 40px; font-weight: 600; cursor: pointer; margin-left: auto; }
.stepcheck input { width: 22px; height: 22px; accent-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

    if (!arr.length) return 0;
    var a = arr.slice().sort(function (x, y) { return x - y; });
    var m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : Math.round((a[m - 1] + a[m]) / 2);

  function questionAt(i) {
    if (i < QUESTIONS.length) return QUESTIONS[i];

    var n = NICHES[key];
    return {
      id: "angle",
      title: "Quel angle te parle le plus ?",
      hint: (state.answers.theme === "unsure" ? "Tu n'as pas choisi de thème : on part sur la finance perso, l'une des niches les plus simples à produire sans visage. " : "") + "Un angle étroit se vend mieux qu'un thème large.",
      options: n.angles.map(function (a, idx) { return { v: String(idx), t: a.n, icon: key }; })
    };
  }

  function buildPlan() {
    var a = state.answers;
    var key = nicheKey();
    var n = NICHES[key];
    var ai = parseInt(a.angle, 10) || 0;
    var order = [ai].concat(n.angles.map(function (_, i) { return i; }).filter(function (i) { return i !== ai; }));
    function mk(ang, title, series) { return { title: title, angle: ang.n, kw: ang.kw, series: !!series, tags: [ang.tag, n.tags[0], n.tags[1]] }; }
    function spec(i) { return n.angles[i].ideas.map(function (t) { return mk(n.angles[i], t, false); }); }
    function ser(i) { var ang = n.angles[i]; return SERIES.map(function (t) { return mk(ang, t.replace("{kw}", ang.kw), true); }); }
    var ideas = [].concat(spec(order[0]), ser(order[0]), spec(order[1]), spec(order[2]), ser(order[1]), ser(order[2]));
    var perWeek = RHYTHM[a.time] || 5;
    var days = [];
    var pat = PATTERN[perWeek];
    var used = 0;
    for (var d = 1; d <= DAYS; d++) {
      var wd = ((d - 1) % 7) + 1;
      if (pat.indexOf(wd) > -1) {
        var idea = ideas[used % ideas.length];
        days.push({ d: d, kind: "post", text: idea.title, idea: idea });
        used += 1;
      } else {
        days.push({ d: d, kind: "rest", text: "Pas de publication. Tourne et monte les prochaines vidéos, ou repose-toi." });
      }
      if (REVIEW_DAYS.indexOf(d) > -1) days.push({ d: d, kind: "review", text: "Bilan" });
    }
    return { key: key, n: n, ai: ai, angle: n.angles[ai], ideas: ideas, perWeek: perWeek, days: days };

  function renderToday(panel, P) {

    if (!prog.steps[d]) prog.steps[d] = [];

    var total = M.steps.reduce(function (s, x) { return s + x.mins; }, 0);

    if (state.flash) {

    }

    for (var i = 1; i <= DAYS; i++) dots.appendChild(h("i", { "class": i < d ? "done" : i === d ? "now" : "" }));
    var label = h("p", { "class": "small" });

    var footer = h("div", { "class": "panel" });
    panel.appendChild(list);
    panel.appendChild(footer);

    function current() {
      for (var i = 0; i < M.steps.length; i++) if (!done[i]) return i;
      return M.steps.length;
    }

      var cur = current();

      label.textContent = cur >= M.steps.length ? "Toutes les étapes sont faites." : "Étape " + (cur + 1) + " sur " + M.steps.length + " · environ " + remaining + " min restantes (sur " + total + " min)";

        } else if (i === cur) {

          nowCard = card;
          card.appendChild(h("p", { "class": "nowtag", text: "À faire maintenant" }));
          card.appendChild(h("div", { "class": "step-head" }, [h("span", { "class": "stepnum", text: String(i + 1) }), h("h4", { text: s.t }), h("span", { "class": "mins", text: "≈ " + s.mins + " min" })]));
          if (s.why) card.appendChild(h("p", { "class": "why", text: s.why }));
          if (s.big) card.appendChild(h("p", { "class": "stepbig", text: s.big }));
          if (s.small) card.appendChild(h("p", { "class": "small", text: s.small }));
          if (s.how) card.appendChild(h("ol", { "class": "how" }, s.how.map(function (x) { return h("li", { text: x }); })));
          var actions = h("div", { "class": "step-actions" });
          if (s.copy) {

          }

          help.addEventListener("click", function () { ask(helpText); });
          card.appendChild(help);
          var ok = h("button", { type: "button", "class": "btn bigbtn", id: "step-done" }, ["Étape terminée"]);
          ok.addEventListener("click", function () { done[i] = true; saveProg(); draw(true); });
          card.appendChild(ok);
          list.appendChild(card);
        } else {
          list.appendChild(h("div", { "class": "card step-mini later" }, [h("span", { "class": "stepnum", text: String(i + 1) }), h("span", { "class": "t", text: s.t }), h("span", { "class": "mins", text: "≈ " + s.mins + " min" })]));
        }
      });
      if (cur >= M.steps.length) {
        var fin = h("button", { type: "button", "class": "btn bigbtn", id: "finish-day" }, [d === DAYS ? "Terminer mon plan" : "Jour terminé, passer au suivant"]);
        fin.addEventListener("click", function () {
          prog.day = d + 1;
          if (d < DAYS) state.flash = "Jour " + d + " terminé, bien joué. Voici le jour " + (d + 1) + ".";
          saveProg();
          showCoach();
          window.scrollTo(0, 0);
        });
        footer.appendChild(fin);
      }
      if (d > 1) {
        var back = h("button", { type: "button", "class": "linkbtn" }, ["Revenir au jour " + (d - 1)]);
        back.addEventListener("click", function () { prog.day = d - 1; saveProg(); showCoach(); window.scrollTo(0, 0); });
        footer.appendChild(back);
      }
      if (scrollToNow) {
        var target = nowCard || footer;
        setTimeout(function () { try { target.scrollIntoView({ block: "start", behavior: "smooth" }); } catch (e) { /* sans effet */ } }, 30);
      }
    }
    draw(false);
  }

  
function renderDone(panel, P) {
    var items = [
      "Ouvre le Suivi et note les chiffres de toutes tes vidéos.",
      "Regarde les téléchargements de ton guide et les ventes de ton produit, même s'ils sont à zéro : c'est ta base de départ.",
      "Demande à ton Coach IA le plan du mois 3."
    ];
    var go = h("button", { type: "button", "class": "btn" }, ["Ouvrir le Suivi"]);
    go.addEventListener("click", function () { state.tab = "suivi"; showCoach(); window.scrollTo(0, 0); });
    var ai = h("button", { type: "button", "class": "btn ghost" }, ["Demander le mois 3"]);
    ai.addEventListener("click", function () { state.chatDraft = "J'ai fini mes deux mois. Propose-moi le plan du mois 3 pour mon angle « " + P.angle.n + " »."; state.tab = "coach"; showCoach(); window.scrollTo(0, 0); });
    var again = h("button", { type: "button", "class": "linkbtn" }, ["Recommencer le plan"]);
    again.addEventListener("click", function () { state.prog = { day: 1, steps: {} }; saveProg(); showCoach(); window.scrollTo(0, 0); });
    panel.appendChild(h("div", { "class": "card" }, [
      h("p", { "class": "eyebrow", text: "Plan terminé" }),
      h("h3", { text: "Tu as fini les 60 jours." }),
      h("ul", { "class": "incl" }, items.map(function (t) { return h("li", { text: t }); })),
      h("div", { "class": "actions" }, [go, ai])
    ]));
    panel.appendChild(again);
  }

  function renderIdeas(panel, P) {
    panel.appendChild(h("p", { "class": "hint", text: "Format conseillé pour ta niche : " + P.n.format + " Ce sont des points de départ. Vérifie toujours un chiffre ou un fait avant de le publier, et ne dis que ce que tu as vraiment fait." }));
    var shown = Math.min(state.ideasShown || 10, P.ideas.length);
    P.ideas.slice(0, shown).forEach(function (idea, i) {
      var caption = idea.kw + " : " + idea.title + " " + idea.tags.join(" ");
      var copy = h("button", { type: "button", "class": "btn ghost small" }, ["Copier la légende"]);
      copy.addEventListener("click", function () { copyText(caption, copy); });
      panel.appendChild(h("div", { "class": "card idea" }, [
        h("span", { "class": "kicker", text: "Idée " + (i + 1) + " · " + idea.angle + (idea.series ? " · format série" : "") }),
        h("h4", { text: idea.title }),
        h("div", { "class": "meta" }, idea.tags.map(function (t) { return h("span", { "class": "chip mono", text: t }); })),
        h("p", { "class": "small", text: "Mot-clé à dire et à afficher dans les 3 premières secondes : « " + idea.kw + " »" }),
        h("div", { "class": "row" }, [h("span", { "class": "small", text: "20 à 40 secondes" }), copy])
      ]));
    });
    if (shown < P.ideas.length) {
      var more = h("button", { type: "button", "class": "btn ghost" }, ["Voir 10 idées de plus (" + shown + " sur " + P.ideas.length + ")"]);
      more.addEventListener("click", function () { state.ideasShown = shown + 10; showCoach(); });
      panel.appendChild(more);
    }
  }

  function chatRules(P) {
    var a = state.answers;
    var GOALS = { audience: "faire grossir son audience", revenus: "gagner ses premiers revenus", vendre: "vendre ses produits" };
    var FORMATS = { ecran: "sans visage, capture d'écran et texte à l'écran", voix: "sans visage, sa voix sur des images", visage: "en apparaissant à l'écran" };
    var d = Math.min(state.prog.day, DAYS);
    var M = stepsFor(P, d);
    var todayIdea = M.steps[0] && M.steps[0].big ? M.steps[0].big : "aucune";
    return [
      "Tu es le Coach IA de « Boussole Niche », une appli qui guide des débutants pour publier sur TikTok.",
      "Tu parles français, tu tutoies, ton chaleureux et simple, phrases courtes. Tu tiens la main de la personne : étapes concrètes et courtes, 150 mots maximum, sauf pour un script.",
      "Contexte de la personne : niche « " + P.n.name + " », angle « " + P.angle.n + " », mot-clé « " + P.angle.kw + " », objectif : " + GOALS[a.goal] + ", format : " + FORMATS[a.format] + ", rythme : " + P.perWeek + " vidéos par semaine, jour du plan : " + d + " sur 60, idée du jour : « " + todayIdea + " ».",
      "Règles : ne promets jamais de vues, d'abonnés ni de revenus. N'invente aucun chiffre ni aucune étude. Si on te parle de vues, dis que la vidéo médiane fait environ 500 vues d'après une analyse Buffer de 11 millions de vidéos, et que chaque cas est différent.",
      "N'invente jamais d'interview, de citation ou de déclaration d'une personne réelle. Pour le foot, pas d'extraits de matchs protégés par des droits. Pas de conseil médical, juridique ou financier personnalisé. Si la question n'a rien à voir avec TikTok, la création de contenu ou le plan, ramène poliment au sujet. Si tu ne sais pas, dis-le.",
      "Quand on te demande un script, donne : l'accroche des 3 premières secondes, 3 à 5 scènes courtes avec le texte à afficher et ce que dit la voix, la fin, puis la légende avec 3 hashtags. Pas de mise en forme markdown : des lignes courtes et des tirets."
    ].join("\n");
  }

  var CHAT_ERRORS = {
    not_granted: "Tu n'as pas autorisé l'accès à Claude. Recharge la page pour réessayer.",
    sampling_disabled: "Le Coach IA n'est pas disponible sur ce compte.",
    capability_disabled: "Le Coach IA n'est pas disponible ici.",
    capability_removed: "Le Coach IA n'est pas disponible ici.",
    not_declared: "Le Coach IA n'est pas disponible ici.",
    rate_limited: "Trop de messages d'un coup. Réessaie dans un instant.",
    session_expired: "Ta session a expiré. Reconnecte-toi puis réessaie.",
    refused: "Je ne peux pas répondre à ça. Reformule ta question."
  };

  var QUICK = [
    "Écris le script de ma vidéo du jour",
    "Donne-moi 5 autres idées pour mon angle",
    "Mes vues sont faibles, que changer ?",
    "Comment répondre aux commentaires ?"
  ];

  var sampleFn = null;
  var sampleReady = false;
  var samplePromise;
  try {
    samplePromise = (window.claude && typeof window.claude.use === "function") ? window.claude.use("sample") : Promise.resolve(null);
  } catch (e) {
    samplePromise = Promise.resolve(null);
  }
  samplePromise = Promise.resolve(samplePromise).then(function (s) { sampleFn = s; sampleReady = true; refreshChatAvailability(); return s; }, function () { sampleReady = true; refreshChatAvailability(); return null; });

  function refreshChatAvailability() {
    var st = document.getElementById("chat-status");
    if (!st || !sampleReady || sampleFn) return;
    st.textContent = "Le Coach IA n'est pas disponible dans cette version. Ton plan et tes missions restent utilisables.";
    ["chat-input", "chat-send"].forEach(function (id) { var el = document.getElementById(id); if (el) el.disabled = true; });
    Array.prototype.forEach.call(document.querySelectorAll(".quick button"), function (b) { b.disabled = true; });
  }

  function renderChat(panel, P) {
    panel.appendChild(h("div", { "class": "card" }, [
      h("p", { "class": "eyebrow", text: "Coach IA" }),
      h("p", { text: "Pose une question sur ta niche, tes vidéos ou ton plan. Je connais ton angle et ton jour du plan." }),
      h("p", { "class": "small", id: "chat-status", text: "Réponses générées par une IA : vérifie-les. Aucun résultat n'est garanti." })
    ]));

    var quick = h("div", { "class": "quick" });
    QUICK.forEach(function (q) {
      var b = h("button", { type: "button", "class": "btn ghost small" }, [q]);
      b.addEventListener("click", function () { send(q); });
      quick.appendChild(b);
    });
    panel.appendChild(quick);

    var log = h("div", { "class": "chat", id: "chat-log", role: "log", "aria-live": "polite" });
    state.chat.forEach(function (m) { log.appendChild(h("div", { "class": "bubble " + (m.role === "user" ? "u" : "a"), text: m.content })); });
    panel.appendChild(log);

    var input = h("textarea", { id: "chat-input", rows: "2", placeholder: "Écris ta question…", "aria-label": "Ta question pour le Coach IA" });
    if (state.chatDraft) { input.value = state.chatDraft; state.chatDraft = ""; }
    var sendBtn = h("button", { type: "button", "class": "btn", id: "chat-send" }, ["Envoyer"]);
    var stopBtn = h("button", { type: "button", "class": "btn ghost", id: "chat-stop" }, ["Stop"]);
    stopBtn.hidden = true;
    var form = h("div", { "class": "chatform" }, [input, sendBtn, stopBtn]);
    panel.appendChild(form);

    function setBusy(b) {
      state.chatBusy = b;
      sendBtn.disabled = b;
      stopBtn.hidden = !b;
    }
    function addBubble(kind, text) {
      var el = h("div", { "class": "bubble " + kind, text: text });
      log.appendChild(el);
      el.scrollIntoView({ block: "nearest" });
      return el;
    }
    function send(text) {
      text = (text || "").trim();
      if (!text || state.chatBusy) return;
      input.value = "";
      state.chat.push({ role: "user", content: text });
      addBubble("u", text);
      var bubble = addBubble("a pending", "Je réfléchis…");
      var ctl = new AbortController();
      stopBtn.onclick = function () { ctl.abort(); };
      setBusy(true);
      samplePromise.then(function (sample) {
        if (!sample) throw { code: "capability_disabled" };
        var turns = [{ role: "user", content: chatRules(P) }].concat(state.chat.slice(-12));
        return sample(turns, {
          cache: false,
          modelTier: "quick",
          signal: ctl.signal,
          onText: function (u) { bubble.className = "bubble a"; bubble.textContent = u.text; bubble.scrollIntoView({ block: "nearest" }); }
        });
      }).then(function (res) {
        state.chat.push({ role: "assistant", content: res.text });
        bubble.className = "bubble a";
        bubble.textContent = res.text + (res.truncated ? "\n\n(Réponse coupée : demande-moi la suite.)" : "");
      }).catch(function (e) {
        var code = e && e.code;
        if (code === "cancelled") {
          if (e.text) { state.chat.push({ role: "assistant", content: e.text }); bubble.className = "bubble a"; bubble.textContent = e.text; }
          else { bubble.remove(); }
        } else {
          var msg = CHAT_ERRORS[code] || "Un souci est survenu. Réessaie.";
          bubble.className = "bubble a err";
          bubble.textContent = (e && e.text ? e.text + "\n\n" : "") + msg;
        }
      }).then(function () { setBusy(false); });
    }
    sendBtn.addEventListener("click", function () { send(input.value); });
    input.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(input.value); }
    });
    if (state.chatBusy) setBusy(true);
    setTimeout(refreshChatAvailability, 0);
  }

  
function renderTracker(panel) {
    var filled = 0;
    state.stats.forEach(function (r, i) { if (r && (r.v != null || r.s != null || r.p != null)) filled = i + 1; });
    var rowsN = Math.min(60, Math.max(state.trackRows || 10, Math.ceil(filled / 10) * 10));
    panel.appendChild(h("p", { "class": "hint", text: "Note les chiffres de tes vidéos (jusqu'à 60), 48 heures après leur publication. Ils restent sur cet appareil." }));
    var grid = h("div", { "class": "track" });
    grid.appendChild(h("span", { "class": "hd", text: "#" }));
    ["Vues", "Sauvegardes", "Partages"].forEach(function (t) { grid.appendChild(h("span", { "class": "hd", text: t })); });
    var inputs = [];
    for (var i = 0; i < rowsN; i++) {
      grid.appendChild(h("span", { "class": "num", text: String(i + 1) }));
      ["v", "s", "p"].forEach(function (k) {
        var val = state.stats[i] && state.stats[i][k] != null ? String(state.stats[i][k]) : "";
        var f = h("input", { "class": "field", id: "f-" + k + i, type: "number", inputmode: "numeric", min: "0", value: val, "aria-label": (k === "v" ? "Vues" : k === "s" ? "Sauvegardes" : "Partages") + " de la vidéo " + (i + 1) });
        f.setAttribute("data-i", String(i));
        f.setAttribute("data-k", k);
        inputs.push(f);
        grid.appendChild(f);
      });
    }
    panel.appendChild(grid);
    if (rowsN < 60) {
      var more = h("button", { type: "button", "class": "btn ghost small" }, ["Ajouter 10 vidéos"]);
      more.addEventListener("click", function () { state.trackRows = rowsN + 10; showCoach(); });
      panel.appendChild(more);
    }
    var out = h("div", { "class": "card" });
    panel.appendChild(out);

    function recompute() {
      var views = [];
      for (var i = 0; i < 60; i++) {
        var r = state.stats[i];
        if (r && r.v != null && !isNaN(r.v)) views.push(r.v);
      }
      out.textContent = "";
      out.appendChild(h("p", { "class": "eyebrow", text: "Tes vrais chiffres" }));
      if (views.length < 3) {
        out.appendChild(h("p", { text: "Renseigne les vues d'au moins 3 vidéos pour voir ton bilan." }));
        return;
      }
      var med = median(views);
      var best = Math.max.apply(null, views);
      var above = views.filter(function (v) { return v > 500; }).length;
      var top = views.filter(function (v) { return v >= 3700; }).length;
      out.appendChild(h("div", { "class": "stat-row" }, [
        h("div", { "class": "stat" }, [h("b", { text: fmt(med) }), h("span", { text: "vues, ta vidéo médiane" })]),
        h("div", { "class": "stat" }, [h("b", { text: fmt(best) }), h("span", { text: "vues, ta meilleure vidéo" })]),
        h("div", { "class": "stat" }, [h("b", { text: above + " / " + views.length }), h("span", { text: "vidéos au-dessus de 500 vues" })]),
        h("div", { "class": "stat" }, [h("b", { text: String(top) }), h("span", { text: "vidéos au-dessus de 3 700 vues" })])
      ]));
      out.appendChild(h("p", { "class": "small", text: med >= 500 ? "Ta médiane dépasse environ 500 vues, la médiane observée sur 11 millions de vidéos. 3 700 vues est le seuil des 10 % de vidéos les plus vues à 1 vidéo par semaine." : "Ta médiane est sous environ 500 vues, la médiane observée sur 11 millions de vidéos. C'est courant au début : juge sur 10 vidéos." }));
      if (views.length >= 6) {
        out.appendChild(h("p", { text: "Prochaine étape : reprends le sujet, la durée et l'accroche de tes 3 vidéos les plus vues, et fais-en ta série de la semaine." }));
      } else {
        out.appendChild(h("p", { text: "Continue jusqu'à 6 vidéos avant de changer quoi que ce soit." }));
      }
    }

    inputs.forEach(function (f) {
      f.addEventListener("input", function () {
        var i = parseInt(f.getAttribute("data-i"), 10);
        var k = f.getAttribute("data-k");
        if (!state.stats[i]) state.stats[i] = {};
        state.stats[i][k] = f.value === "" ? null : Number(f.value);
        store.set("bn_stats", state.stats);
        recompute();
      });
    });
    recompute();
  }

  /* ---------- Démarrage ---------- */
  renderQuestion();
})();
</script>
